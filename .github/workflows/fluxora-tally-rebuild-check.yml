name: Fluxora Tally Rebuild Check

on:
  push:
    branches:
      - fluxora-tally-rebuild
    paths:
      - "fluxora-tally/**"
      - ".github/workflows/fluxora-tally-rebuild-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "fluxora-tally/**"
      - ".github/workflows/fluxora-tally-rebuild-check.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fluxora-tally
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Brand QA
        run: npm run brand:qa
      - name: Build
        run: npm run build
      - name: Package deploy source
        run: zip -r ../fluxora-tally-deploy.zip . -x 'node_modules/*' '.next/*' '.env*' '.vercel/*' '*.log'
      - name: Upload deploy source
        uses: actions/upload-artifact@v4
        with:
          name: fluxora-tally-deploy-source
          path: fluxora-tally-deploy.zip
          if-no-files-found: error
          retention-days: 1
