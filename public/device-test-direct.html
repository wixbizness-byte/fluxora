<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fluxora Direct Device Test</title>
<style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#fbf7f2;color:#6f1830;font-family:Inter,Arial,sans-serif;padding:24px}.card{max-width:720px;margin:40px auto;background:#fffdfa;border:1px solid #ead8d4;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(87,31,43,.10)}h1{font-family:Georgia,serif;font-size:32px;margin:0 0 8px}p{color:#9a6570;line-height:1.5}.row{display:flex;gap:10px;flex-wrap:wrap}.input{flex:1 1 300px;height:50px;border-radius:14px;border:1px solid #e3d0c6;padding:0 16px;background:#f6eee3;font-size:16px;letter-spacing:2px}.btn{height:50px;border:0;border-radius:14px;padding:0 22px;background:#8e2948;color:white;font-weight:800}.status{margin-top:18px;padding:16px;border-radius:14px;background:#fff6f3;border:1px solid #edd9d3;line-height:1.5}.elapsed{font-family:Georgia,serif;font-size:42px;font-weight:700;margin-top:18px}.meta{display:grid;gap:8px;margin-top:16px;font-size:13px}.pass{margin-top:18px;padding:16px;border-radius:14px;background:#edf6ef;color:#28613b;font-weight:800}.reset{width:100%;margin-top:22px;min-height:48px;border-radius:14px;border:1px solid #d9bfc5;background:#fff;color:#8e2948;font-weight:800}</style></head>
<body><section class="card"><div style="font-size:12px;letter-spacing:3px;color:#bd8f97;margin-bottom:8px">FLUXORA V34 DIRECT TEST</div><h1>3-call device benchmark</h1><p>No flow database. No polling backend. Code check → register/challenge → verify.</p><div class="row"><input id="code" class="input" placeholder="ACCESS CODE" autocomplete="off"><button id="check" class="btn">CHECK DEVICE</button></div><div id="status" class="status"><strong>Status:</strong> Ready.</div><div id="elapsed" class="elapsed">—</div><div class="meta"><div><strong>Legacy ID:</strong> <code id="legacy"></code></div><div><strong>Current credential:</strong> <code id="current">—</code></div><div><strong>Previous credential:</strong> <code id="previous">—</code></div></div><div id="pass" class="pass" style="display:none">PASS: Same Fluxora crypto device survived the simulated Canvas reset.</div><button id="reset" class="reset">SIMULATE GEMINI CANVAS RESET</button></section>
<script>
(() => {
const GATEWAY='https://hyulsxhzukqcmkodlgsi.supabase.co/functions/v1/fluxora-canvas-gateway';
const PAGE='https://www.fluxora.wiki/device-check-direct.html?v=34';
const ORIGIN='https://www.fluxora.wiki';
const KEY='fluxora.deviceTest.direct.legacy.v1';
const $=id=>document.getElementById(id);
let legacy=localStorage.getItem(KEY)||'';let current='',previous='';
function random(){if(crypto.randomUUID)return crypto.randomUUID();const b=new Uint8Array(24);crypto.getRandomValues(b);return [...b].map(x=>x.toString(16).padStart(2,'0')).join('')}
if(legacy.length<12){legacy=random();localStorage.setItem(KEY,legacy)}$('legacy').textContent=legacy;
function channel(){const b=new Uint8Array(32);crypto.getRandomValues(b);let s='';for(const x of b)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'')}
function browser(){const u=navigator.userAgent||'';if(/Edg\//.test(u))return'Edge';if(/Chrome\//.test(u)&&!/Edg\//.test(u))return'Chrome';if(/Firefox\//.test(u))return'Firefox';if(/Safari\//.test(u)&&!/Chrome\//.test(u))return'Safari';return'Browser'}
function platform(){return String(navigator.userAgentData?.platform||navigator.platform||'Unknown').slice(0,120)}
async function gateway(body){const r=await fetch(GATEWAY,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({toolId:'product-affiliate',...body})});let d=null;try{d=await r.json()}catch{}if(!r.ok||!d||d.success===false){const e=new Error(d?.message||`Request failed (${r.status}).`);e.backend=d||null;throw e}return d}
function makeBridge(ch,popup){let ready=false,payload=null,done=false,res,rej;const promise=new Promise((r,j)=>{res=r;rej=j});const timer=setTimeout(()=>fail(new Error('Timed out.')),10000);function clean(){clearTimeout(timer);window.removeEventListener('message',on)}function fail(e){if(done)return;done=true;clean();rej(e)}function send(){if(ready&&payload&&!done&&!popup.closed)popup.postMessage({type:'fluxora-device-begin',channel:ch,...payload},ORIGIN)}function on(ev){if(ev.origin!==ORIGIN||ev.source!==popup)return;const m=ev.data||{};if(m.channel!==ch)return;if(m.type==='fluxora-device-ready'){ready=true;send()}else if(m.type==='fluxora-device-verified'){done=true;clean();res(m.result||{})}else if(m.type==='fluxora-device-failed'){const e=new Error(m.message||'Device verification failed.');e.backend=m.backend||null;fail(e)}}window.addEventListener('message',on);return{verify(p){payload=p;send();return promise}}}
async function run(){const code=$('code').value.trim().toLowerCase().replace(/\s+/g,'');if(!code)return;const ch=channel();const pop=window.open(`${PAGE}#channel=${encodeURIComponent(ch)}`,'FluxoraDirectTest','popup=yes,width=500,height=520,resizable=yes,scrollbars=yes');if(!pop){$('status').innerHTML='<strong>Status:</strong> Pop-up blocked.';return}const bridge=makeBridge(ch,pop);const t=performance.now();$('check').disabled=true;$('status').innerHTML='<strong>Status:</strong> Checking…';$('elapsed').textContent='…';try{const access=await gateway({action:'checkAccess',accessCode:code,deviceId:legacy});if(access.authorized!==true||!access.sessionToken)throw new Error(access.message||'Code denied.');const verified=await bridge.verify({toolId:'product-affiliate',sessionToken:access.sessionToken,deviceId:legacy,browser:browser(),platform:platform()});if(verified.authorized!==true||!verified.sessionToken||!verified.deviceCredentialId)throw new Error('No v3 device session returned.');const ms=Math.round(performance.now()-t);previous=current||previous;current=String(verified.deviceCredentialId);$('current').textContent=current;$('previous').textContent=previous||'—';$('elapsed').textContent=`${ms} ms`;$('status').innerHTML='<strong>Status:</strong> PASS — credential-bound v3 session ready.';$('pass').style.display=previous&&previous===current?'block':'none'}catch(e){const ms=Math.round(performance.now()-t);$('elapsed').textContent=`${ms} ms`;$('status').innerHTML=`<strong>Status:</strong> FAIL — ${String(e?.message||e)}`}finally{$('check').disabled=false}}
$('check').onclick=run;$('code').onkeydown=e=>{if(e.key==='Enter')run()};$('reset').onclick=()=>{legacy=random();localStorage.setItem(KEY,legacy);$('legacy').textContent=legacy;if(current)previous=current;current='';$('current').textContent='—';$('previous').textContent=previous||'—';$('pass').style.display='none';$('code').value='';$('elapsed').textContent='—';$('status').innerHTML='<strong>Status:</strong> Simulated Gemini reset. Enter the same code again.'};
})();
</script></body></html>
