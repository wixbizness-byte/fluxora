<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fluxora Device Check</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#fbf7f2;color:#6f1830;font-family:Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);background:#fffdfa;border:1px solid #ead8d4;border-radius:22px;padding:26px;box-shadow:0 18px 48px rgba(87,31,43,.12);text-align:center}.dot{width:44px;height:44px;margin:0 auto 16px;border-radius:50%;border:4px solid #ead8d4;border-top-color:#8e2948;animation:s .7s linear infinite}.ok{display:none;width:44px;height:44px;margin:0 auto 16px;border-radius:50%;background:#edf6ef;color:#2e6f43;font-size:28px;line-height:44px;font-weight:800}h1{font-family:Georgia,serif;font-size:27px;margin:0 0 9px}.sub{color:#a96772;line-height:1.45;margin:0}.error{display:none;margin-top:16px;padding:12px;border-radius:13px;background:#fff0f2;border:1px solid #f2ccd3;color:#9b1c34;font-size:14px;line-height:1.45}.actions{display:none;gap:10px;margin-top:18px}.btn{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:13px;padding:0 16px;font-weight:800;text-decoration:none}.primary{background:#8e2948;color:#fff}.secondary{background:#fff7f3;color:#8e2948;border:1px solid #dfc7cc}.small{font-size:12px;color:#bd8f97;margin-top:16px}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="card">
  <div id="spin" class="dot"></div>
  <div id="ok" class="ok">✓</div>
  <h1 id="title">Verifying this device</h1>
  <p id="sub" class="sub">Secure device proof is running.</p>
  <div id="error" class="error"></div>
  <div id="actions" class="actions">
    <a class="btn primary" href="/members">Manage Registered Devices</a>
    <a class="btn secondary" href="javascript:window.close()">Close Device Check</a>
  </div>
  <div class="small">Fluxora secure device check</div>
</main>
<script>
(() => {
'use strict';
const API='https://hyulsxhzukqcmkodlgsi.supabase.co/functions/v1/fluxora-canvas-device-fast';
const DB='fluxora-top-level-device-vault-v1',STORE='keys',KEY='device-p256';
const token=new URLSearchParams((location.hash||'').replace(/^#/,'')).get('flow')||'';
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function api(action,extra={}){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({action,flowToken:token,...extra})});
  let d=null;try{d=await r.json()}catch{}
  if(!r.ok||!d||d.success===false){const e=new Error(d?.message||`Secure device check failed (${r.status}).`);e.backend=d||null;throw e}
  return d;
}
function openDb(){return new Promise((res,rej)=>{let q;try{q=indexedDB.open(DB,1)}catch(e){rej(e);return}q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE,{keyPath:'id'})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error||new Error('Device storage unavailable.'));q.onblocked=()=>rej(new Error('Device storage is blocked.'))})}
async function getKey(){const db=await openDb();try{return await new Promise((res,rej)=>{const q=db.transaction(STORE,'readonly').objectStore(STORE).get(KEY);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error||new Error('Device key read failed.'))})}finally{db.close()}}
async function putKey(rec){const db=await openDb();try{await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(rec);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error||new Error('Device key write failed.'));tx.onabort=()=>rej(tx.error||new Error('Device key write aborted.'))})}finally{db.close()}}
async function ensureKey(){if(!crypto?.subtle)throw new Error('Web Crypto is unavailable in this browser.');let rec=await getKey();if(rec?.privateKey&&rec?.publicKey)return rec;const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},false,['sign','verify']);rec={id:KEY,privateKey:pair.privateKey,publicKey:pair.publicKey,createdAt:new Date().toISOString()};await putKey(rec);return rec}
function b64(bytes){let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'')}
async function waitStarted(){const end=Date.now()+12000;while(Date.now()<end){const d=await api('status');if(d.status==='started'||d.status==='challenge'||d.status==='verified')return d;if(['failed','cancelled','expired'].includes(String(d.status||'')))throw new Error(d.message||'Device verification was not approved.');await sleep(100)}throw new Error('Fluxora approval did not reach this device check in time.')}
function fail(msg){$('spin').style.display='none';$('title').textContent='Device check failed';$('sub').textContent='Free a registered-device slot, then return to the Fluxora tool and press Check Code again.';$('error').textContent=msg||'Device verification failed.';$('error').style.display='block';$('actions').style.display='grid'}
function done(){$('spin').style.display='none';$('ok').style.display='block';$('title').textContent='Device verified';$('sub').textContent='Fluxora access is ready.';setTimeout(()=>{try{window.close()}catch{}},260)}
async function run(){
  if(!/^[A-Za-z0-9_-]{40,100}$/.test(token))throw new Error('Invalid device verification flow.');
  const [rec,start]=await Promise.all([ensureKey(),waitStarted()]);
  if(start.status==='verified'){done();return}
  const publicKeyJwk=await crypto.subtle.exportKey('jwk',rec.publicKey);
  const enroll=await api('enroll',{publicKeyJwk});
  const challenge=String(enroll.challenge||'');if(!challenge)throw new Error('Fluxora did not return a device challenge.');
  const sig=new Uint8Array(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},rec.privateKey,new TextEncoder().encode(challenge)));
  await api('verify',{deviceSignature:b64(sig)});
  done();
}
run().catch(e=>fail(String(e?.message||e||'Device verification failed.')));
})();
</script>
</body>
</html>
