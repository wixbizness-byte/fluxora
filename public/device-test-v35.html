<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fluxora v35 Instant Access Test</title>
<style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#fbf7f2;color:#6f1830;font-family:Inter,Arial,sans-serif;padding:24px}.card{max-width:720px;margin:40px auto;background:#fffdfa;border:1px solid #ead8d4;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(87,31,43,.10)}h1{font-family:Georgia,serif;font-size:32px;margin:0 0 8px}p{color:#9a6570;line-height:1.5}.row{display:flex;gap:10px;flex-wrap:wrap}.input{flex:1 1 300px;height:50px;border-radius:14px;border:1px solid #e3d0c6;padding:0 16px;background:#f6eee3;font-size:16px;letter-spacing:2px}.btn{height:50px;border:0;border-radius:14px;padding:0 22px;background:#8e2948;color:white;font-weight:800}.box{margin-top:18px;padding:16px;border-radius:14px;background:#fff6f3;border:1px solid #edd9d3;line-height:1.5}.time{font-family:Georgia,serif;font-size:42px;font-weight:700;margin-top:18px}.ok{color:#28613b}.warn{color:#9b6b14}.err{color:#9b1c34}</style></head>
<body><section class="card"><div style="font-size:12px;letter-spacing:3px;color:#bd8f97;margin-bottom:8px">FLUXORA V35 TEST</div><h1>Instant access + background tracking</h1><p>The access timer stops the moment Fluxora approves the normal v2 session. Device tracking runs afterward and is timed separately.</p><div class="row"><input id="code" class="input" placeholder="ACCESS CODE" autocomplete="off"><button id="check" class="btn">CHECK ACCESS</button></div><div id="access" class="box"><strong>Access:</strong> Ready.</div><div id="accessTime" class="time">—</div><div id="track" class="box"><strong>Background tracker:</strong> Waiting.</div></section>
<script>(()=>{'use strict';
const GATEWAY='https://hyulsxhzukqcmkodlgsi.supabase.co/functions/v1/fluxora-canvas-gateway';
const TRACK='https://hyulsxhzukqcmkodlgsi.supabase.co/functions/v1/fluxora-canvas-device-track';
const KEY='fluxora.v35.test.device.v1';
const $=id=>document.getElementById(id);
function rid(){if(crypto.randomUUID)return crypto.randomUUID();const b=new Uint8Array(24);crypto.getRandomValues(b);return [...b].map(x=>x.toString(16).padStart(2,'0')).join('')}
let deviceId=localStorage.getItem(KEY)||'';if(deviceId.length<12){deviceId=rid();localStorage.setItem(KEY,deviceId)}
function browser(){const u=navigator.userAgent||'';if(/Edg\//.test(u))return'Edge';if(/Chrome\//.test(u)&&!/Edg\//.test(u))return'Chrome';if(/Firefox\//.test(u))return'Firefox';if(/Safari\//.test(u)&&!/Chrome\//.test(u))return'Safari';return'Browser'}
function platform(){return String(navigator.userAgentData?.platform||navigator.platform||'Unknown').slice(0,120)}
async function fingerprint(){const w=Number(screen.width||0),h=Number(screen.height||0),lo=Math.min(w,h),hi=Math.max(w,h),bucket=v=>v?Math.round(v/100)*100:0;const s=['fluxora-soft-device-v1',browser(),platform(),`screen:${bucket(lo)}x${bucket(hi)}`,`dpr:${Math.round(Number(devicePixelRatio||1)*10)/10}`,`touch:${Number(navigator.maxTouchPoints||0)}`,`cpu:${Number(navigator.hardwareConcurrency||0)}`,`memory:${Number(navigator.deviceMemory||0)}`,`depth:${Number(screen.colorDepth||0)}`].join('|');const d=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));return [...d].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(body)});let d=null;try{d=await r.json()}catch{}if(!r.ok||!d||d.success===false)throw new Error(d?.message||`Request failed (${r.status})`);return d}
async function run(){const code=$('code').value.trim().toLowerCase().replace(/\s+/g,'');if(!code)return;$('check').disabled=true;$('access').className='box';$('track').className='box';$('access').innerHTML='<strong>Access:</strong> Checking…';$('track').innerHTML='<strong>Background tracker:</strong> Waiting for access.';$('accessTime').textContent='…';const t=performance.now();try{const access=await post(GATEWAY,{toolId:'product-affiliate',action:'checkAccess',accessCode:code,deviceId});if(access.authorized!==true||!access.sessionToken)throw new Error(access.message||'Access denied.');const ms=Math.round(performance.now()-t);$('accessTime').textContent=`${ms} ms`;$('access').className='box ok';$('access').innerHTML=`<strong>Access:</strong> APPROVED — ${access.tier||'Member'} session is usable now.`;$('track').innerHTML='<strong>Background tracker:</strong> Running after approval…';const tt=performance.now();try{const fp=await fingerprint();const tracked=await post(TRACK,{toolId:'product-affiliate',sessionToken:access.sessionToken,deviceId,fingerprintHash:fp,browser:browser(),platform:platform()});const tm=Math.round(performance.now()-tt);$('track').className=tracked.overLimit?'box warn':'box ok';$('track').innerHTML=`<strong>Background tracker:</strong> ${tracked.overLimit?'FLAGGED':'tracked'} in ${tm} ms · ${tracked.activeDevices}/${tracked.deviceLimit??'∞'} devices.`}catch(e){$('track').className='box err';$('track').innerHTML=`<strong>Background tracker:</strong> skipped/failed — ${String(e?.message||e)}`}}catch(e){const ms=Math.round(performance.now()-t);$('accessTime').textContent=`${ms} ms`;$('access').className='box err';$('access').innerHTML=`<strong>Access:</strong> FAIL — ${String(e?.message||e)}`;$('track').innerHTML='<strong>Background tracker:</strong> not started.'}finally{$('check').disabled=false}}
$('check').onclick=run;$('code').onkeydown=e=>{if(e.key==='Enter')run()};})();</script></body></html>
